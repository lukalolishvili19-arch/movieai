spring:
  application:
    name: movieai-backend
  config:
    # Local development convenience: KEY=VALUE pairs in backend/.env are loaded as properties.
    import: optional:file:.env[.properties]
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/movieai}
    username: ${DATABASE_USERNAME:movieai}
    password: ${DATABASE_PASSWORD:movieai}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: always
    serialization:
      write-dates-as-timestamps: false
  mvc:
    problemdetails:
      enabled: false

server:
  port: ${PORT:8080}
  shutdown: graceful
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false
  compression:
    enabled: true
    mime-types: application/json

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
  default-produces-media-type: application/json

movieai:
  tmdb:
    access-token: ${TMDB_ACCESS_TOKEN:}
    api-base-url: ${TMDB_API_BASE_URL:https://api.themoviedb.org/3}
    default-image-base-url: https://image.tmdb.org/t/p/
    language: ${TMDB_LANGUAGE:en-US}
    default-region: ${TMDB_DEFAULT_REGION:US}
    connect-timeout: 3s
    read-timeout: 8s
    max-concurrent-requests: 20
  security:
    jwt:
      secret: ${JWT_SECRET:}
      refresh-secret: ${JWT_REFRESH_SECRET:}
      issuer: movieai
      access-token-ttl: 15m
      refresh-token-ttl: 30d
    refresh-cookie:
      name: movieai_refresh
      path: /api/v1/auth
      secure: ${REFRESH_COOKIE_SECURE:true}
      same-site: ${REFRESH_COOKIE_SAME_SITE:Lax}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8443,http://localhost:5173}
  rate-limit:
    enabled: true
    # requests per minute, per client
    public-per-minute: 300
    search-per-minute: 60
    recommendations-per-minute: 40
    auth-per-minute: 10
    watchlist-per-minute: 60
  cache:
    trending-ttl: 30m
    lists-ttl: 1h
    discover-ttl: 30m
    search-ttl: 10m
    details-ttl: 6h
    reference-ttl: 24h
    stale-ttl: 7d
    max-entries: 5000
    stale-max-entries: 20000
