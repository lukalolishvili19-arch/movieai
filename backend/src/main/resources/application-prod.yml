# Production overrides, enabled with SPRING_PROFILES_ACTIVE=prod.
# Values without a default are required: startup fails fast instead of falling back to local settings.
spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME:}
    password: ${DATABASE_PASSWORD:}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:5}
      minimum-idle: ${DATABASE_MIN_IDLE:1}
      # milliseconds: recycle connections before provider/proxy idle cut-offs
      max-lifetime: 1500000
      keepalive-time: 300000

server:
  # Render terminates TLS at its proxy and sends X-Forwarded-For / X-Forwarded-Proto.
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:native}

springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}

movieai:
  tmdb:
    access-token: ${TMDB_ACCESS_TOKEN}
  security:
    jwt:
      secret: ${JWT_SECRET}
      refresh-secret: ${JWT_REFRESH_SECRET}
    refresh-cookie:
      secure: true
      # The frontend and API are on different sites (e.g. *.vercel.app and *.onrender.com), so the
      # refresh cookie must be SameSite=None. Use Lax when both share a registrable domain.
      same-site: ${REFRESH_COOKIE_SAME_SITE:None}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS}
